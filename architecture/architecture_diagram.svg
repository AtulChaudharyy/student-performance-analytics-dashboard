<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff" />
      <stop offset="100%" stop-color="#cffafe" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="760" fill="#f8fafc" rx="16" />

  <!-- Top Title Banner -->
  <rect x="24" y="20" width="912" height="70" rx="12" fill="url(#headerGrad)" filter="url(#shadow)" />
  <text x="480" y="52" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">
    STUDENT PERFORMANCE ANALYTICS DASHBOARD (SPAD)
  </text>
  <text x="480" y="74" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="500" fill="#a5b4fc" text-anchor="middle">
    End-to-End Cloud-Native DevOps Architecture &amp; CI/CD Flow
  </text>

  <!-- SECTION 1: Client & User Tier -->
  <rect x="50" y="115" width="230" height="90" rx="10" fill="url(#blueCard)" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)" />
  <text x="165" y="145" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">User / Faculty / Admin</text>
  <text x="165" y="165" font-family="'Inter', sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">Standard Web Browser</text>
  <text x="165" y="183" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Desktop, Tablet, or Mobile (HTTPS)</text>

  <!-- Arrow: User -> Frontend -->
  <line x1="280" y1="160" x2="350" y2="160" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- SECTION 2: Frontend & UI Tier -->
  <rect x="355" y="115" width="250" height="90" rx="10" fill="url(#cyanCard)" stroke="#67e8f9" stroke-width="1.5" filter="url(#shadow)" />
  <text x="480" y="145" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0e7490" text-anchor="middle">Interactive Dashboard UI</text>
  <text x="480" y="165" font-family="'Inter', sans-serif" font-size="11" fill="#0891b2" text-anchor="middle">HTML5, Modern CSS &amp; Chart.js</text>
  <text x="480" y="183" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Dynamic Charts, KPIs, Student Records</text>

  <!-- Arrow: UI -> Backend -->
  <line x1="605" y1="160" x2="675" y2="160" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- SECTION 3: Application Server / Backend Tier -->
  <rect x="680" y="115" width="230" height="90" rx="10" fill="url(#purpleCard)" stroke="#d8b4fe" stroke-width="1.5" filter="url(#shadow)" />
  <text x="795" y="145" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#581c87" text-anchor="middle">Flask Web Server (Python)</text>
  <text x="795" y="165" font-family="'Inter', sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle">RESTful Endpoints &amp; Routes</text>
  <text x="795" y="183" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Gunicorn WSGI / Port 5000 / 10000</text>

  <!-- Arrow down from Backend to Database / Logic Tier -->
  <line x1="795" y1="205" x2="795" y2="255" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- SECTION 4: Processing Logic & Database Box -->
  <rect x="520" y="260" width="390" height="135" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4" />
  <text x="715" y="283" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">DATA &amp; COMPUTATION LAYER</text>

  <rect x="535" y="295" width="170" height="85" rx="8" fill="url(#amberCard)" stroke="#fde68a" stroke-width="1.5" />
  <text x="620" y="322" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Analytics Engine</text>
  <text x="620" y="340" font-family="'Inter', sans-serif" font-size="10" fill="#b45309" text-anchor="middle">Grade &amp; % Calculation</text>
  <text x="620" y="356" font-family="'Inter', sans-serif" font-size="10" fill="#b45309" text-anchor="middle">At-Risk Student Identification</text>

  <rect x="725" y="295" width="170" height="85" rx="8" fill="url(#blueCard)" stroke="#bfdbfe" stroke-width="1.5" />
  <text x="810" y="322" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">SQLite Database</text>
  <text x="810" y="340" font-family="'Inter', sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">students.db</text>
  <text x="810" y="356" font-family="'Inter', sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">Relational Student Records</text>

  <!-- Arrow down from Data to Docker -->
  <path d="M 715 395 L 715 440 L 480 440 L 480 470" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- SECTION 5: Containerization Tier (Docker) -->
  <rect x="340" y="475" width="280" height="95" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="2" filter="url(#shadow)" />
  <text x="480" y="505" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">Docker Containerization</text>
  <text x="480" y="525" font-family="'Inter', sans-serif" font-size="11" fill="#14b8a6" text-anchor="middle">python:3.11-slim Base Image</text>
  <text x="480" y="543" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Dockerfile • Healthcheck • Port Binding</text>

  <!-- Arrow from Docker to Git/GitHub -->
  <line x1="340" y1="522" x2="270" y2="522" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- SECTION 6: GitHub Repository Tier -->
  <rect x="50" y="475" width="215" height="95" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)" />
  <text x="157" y="505" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">GitHub Repository</text>
  <text x="157" y="525" font-family="'Inter', sans-serif" font-size="11" fill="#475569" text-anchor="middle">Git Version Control</text>
  <text x="157" y="543" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Trunk-based Branching &amp; Triggers</text>

  <!-- Arrow down from GitHub to GitHub Actions -->
  <line x1="157" y1="570" x2="157" y2="615" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- SECTION 7: CI/CD Pipeline Tier -->
  <rect x="50" y="620" width="370" height="110" rx="10" fill="url(#greenCard)" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)" />
  <text x="235" y="648" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">GitHub Actions CI/CD Pipeline</text>
  <text x="235" y="668" font-family="'Inter', sans-serif" font-size="11" fill="#166534" text-anchor="middle">Automated PyTest Suite • Syntax Linter</text>
  <text x="235" y="686" font-family="'Inter', sans-serif" font-size="11" fill="#166534" text-anchor="middle">Automated Docker Image Build &amp; Verification</text>
  <text x="235" y="704" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Triggers on: git push origin main</text>

  <!-- Arrow: CI/CD -> Render Cloud -->
  <line x1="420" y1="675" x2="520" y2="675" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />

  <!-- SECTION 8: Cloud Deployment (Render) -->
  <rect x="530" y="620" width="380" height="110" rx="10" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)" />
  <text x="720" y="648" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0369a1" text-anchor="middle">Render Cloud Platform (Live Web Service)</text>
  <text x="720" y="668" font-family="'Inter', sans-serif" font-size="11" fill="#0284c7" text-anchor="middle">Production Web Service • Zero Downtime Deploys</text>
  <text x="720" y="686" font-family="'Inter', sans-serif" font-size="11" fill="#0284c7" text-anchor="middle">Automatic HTTPS / SSL • render.yaml Blueprint</text>
  <text x="720" y="704" font-family="'Inter', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Live Public URL: https://student-performance-analytics-*.onrender.com</text>

</svg>
